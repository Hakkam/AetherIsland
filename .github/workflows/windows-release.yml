name: Build Windows installer

on:
  push:
    branches:
      - AetherIsland
    paths:
      - "src/**"
      - "tools/**"
      - "installer/**"
      - "tests/**"
      - "*.slnx"
      - "Directory.Build.props"
      - ".github/workflows/windows-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-release:
    name: Windows x64 / .NET 10
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore AetherIsland.slnx
      - name: Build release
        run: dotnet build AetherIsland.slnx -c Release --no-restore
      - name: Unit tests
        run: dotnet test tests/AetherIsland.Tests/AetherIsland.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"
      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Create self-contained executable and Setup.exe
        shell: pwsh
        run: ./tools/package-installer.ps1 -SelfContained
      - name: Smoke-check installation, uninstall and data preservation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Resolve-Path 'release/AetherIsland-Setup-win-x64.exe').Path
          $folder = Join-Path $env:RUNNER_TEMP 'AetherIsland-Smoke-Install'
          $manual = Join-Path $env:RUNNER_TEMP 'AetherIsland-Smoke-Manual'
          $dataDir = Join-Path $env:LOCALAPPDATA 'AetherIsland'
          New-Item -ItemType Directory -Path $dataDir -Force | Out-Null
          $marker = Join-Path $dataDir 'ci-keep-user-data.marker'
          Set-Content -LiteralPath $marker -Value 'preserve this data'
          $args = "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$folder`" /LOG=`"$env:RUNNER_TEMP\AetherIsland-install.log`""
          $install = Start-Process -FilePath $installer -ArgumentList $args -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Inno installer returned $($install.ExitCode)" }
          $installedExe = Join-Path $folder 'AetherIsland.exe'
          $uninstaller = Join-Path $folder 'unins000.exe'
          if (!(Test-Path $installedExe) -or !(Test-Path $uninstaller)) {
            throw 'Inno setup failed to install executable or uninstaller'
          }
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          New-Item -Path $runKey -Force | Out-Null
          Set-ItemProperty -Path $runKey -Name 'AetherIsland' -Value ("`"" + $installedExe + "`"")
          $remove = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "Inno uninstaller returned $($remove.ExitCode)" }
          if (Test-Path $installedExe) { throw 'Inno uninstall left the executable behind' }
          if ((Get-ItemProperty -Path $runKey -Name AetherIsland -ErrorAction SilentlyContinue).AetherIsland) {
            throw 'Inno uninstall left an obsolete startup registry value'
          }
          if (!(Test-Path $marker)) { throw 'Inno uninstall deleted private user data' }
          & 'release/win-x64/Install-AetherIsland.ps1' -Destination $manual -SkipShortcuts
          if (!(Test-Path (Join-Path $manual 'AetherIsland.exe'))) {
            throw 'Manual install did not copy the app'
          }
          & 'release/win-x64/Uninstall-AetherIsland.ps1' -Destination $manual
          if (Test-Path (Join-Path $manual 'AetherIsland.exe')) {
            throw 'Manual uninstall did not remove the app'
          }
          if (!(Test-Path $marker)) { throw 'Manual uninstall deleted private user data' }
          Remove-Item -LiteralPath $marker -Force
          Write-Host 'Inno and manual install/uninstall smoke checks passed'
      - name: Archive portable application
        shell: pwsh
        run: |
          Compress-Archive -Path "release/win-x64/*" -DestinationPath "release/AetherIsland-Portable-win-x64.zip" -CompressionLevel Optimal -Force
          if (!(Test-Path "release/AetherIsland-Portable-win-x64.zip")) { throw "Portable package missing" }
          if (!(Test-Path "release/AetherIsland-Setup-win-x64.exe")) { throw "Installer missing" }
      - name: Upload Setup and portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AetherIsland-Windows-x64
          path: |
            release/AetherIsland-Setup-win-x64.exe
            release/AetherIsland-Portable-win-x64.zip
          if-no-files-found: error
          retention-days: 30
