name: Portable V2 Windows acceptance
on:
  push:
    branches: [AetherIsland]
    paths:
      - "src/**"
      - "tools/publish-portable-v2.ps1"
      - "tests/**"
      - "AetherIsland.slnx"
      - "Directory.Build.props"
      - ".github/workflows/windows-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-windows:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Use .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore AetherIsland.slnx
      - name: Build V2 and shared projects
        run: dotnet build AetherIsland.slnx -c Release --no-restore
      - name: Unit tests after all three phases
        run: dotnet test tests/AetherIsland.Tests/AetherIsland.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"
      - name: Create portable self-contained release
        shell: pwsh
        run: ./tools/publish-portable-v2.ps1
      - name: Launch portable app and record idle resource sample
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'release/portable-v2/win-x64/AetherIsland.exe').Path
          $folder = Split-Path $exe -Parent
          $proc = $null
          try {
            $proc = Start-Process -FilePath $exe -WorkingDirectory $folder -PassThru
            Start-Sleep -Seconds 8
            $proc.Refresh()
            if ($proc.HasExited) { throw "Portable V2 exited on launch with code $($proc.ExitCode)" }
            if (!(Test-Path (Join-Path $folder 'Data'))) { throw 'Portable data folder was not created beside EXE' }
            $startCpu = $proc.TotalProcessorTime.TotalSeconds
            $started = [DateTime]::UtcNow
            Start-Sleep -Seconds 15
            $proc.Refresh()
            if ($proc.HasExited) { throw "Portable V2 exited during idle with code $($proc.ExitCode)" }
            $elapsed = [Math]::Max(1, ([DateTime]::UtcNow - $started).TotalSeconds)
            $cpu = [Math]::Max(0, ($proc.TotalProcessorTime.TotalSeconds - $startCpu)) / $elapsed / [Environment]::ProcessorCount * 100
            $mb = [Math]::Round($proc.WorkingSet64 / 1MB, 1)
            Write-Host "Windows runner 15-second idle sample: mean process CPU $([Math]::Round($cpu, 2))%; working set $mb MiB"
            Write-Host 'Runner-specific observations: not Acer laptop benchmarks and not interactive UI acceptance'
          }
          finally {
            if ($proc -and !$proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Inspect portable output
        shell: pwsh
        run: |
          $out = 'release/portable-v2/win-x64'
          if (!(Test-Path "$out/AetherIsland.exe")) { throw "Missing portable executable" }
          if (!(Test-Path "$out/portable.flag")) { throw "Missing portable mode marker" }
          # The launch smoke test above creates Data next to the extracted EXE.
          # Inspect the already-created distribution ZIP rather than the smoke folder.
          $zipPath = (Resolve-Path 'release/portable-v2/AetherIsland-Portable-V2-win-x64.zip').Path
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            foreach ($entry in $archive.Entries) {
              if ($entry.FullName -match '(^|/)Data(/|$)') { throw 'Portable distribution contains user data' }
            }
          }
          finally { $archive.Dispose() }
          $checksum = (Get-FileHash 'release/portable-v2/AetherIsland-Portable-V2-win-x64.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = (Get-Content 'release/portable-v2/AetherIsland-Portable-V2-win-x64.zip.sha256' -Raw).Split(' ')[0]
          if ($checksum -ne $expected) { throw "Portable ZIP hash mismatch" }
      - name: Upload Windows Portable V2
        uses: actions/upload-artifact@v4
        with:
          name: AetherIsland-Portable-V2-win-x64
          path: |
            release/portable-v2/AetherIsland-Portable-V2-win-x64.zip
            release/portable-v2/AetherIsland-Portable-V2-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
