name: Portable V2 Windows acceptance
on:
  push:
    branches: [AetherIsland]
    paths:
      - "src/**"
      - "tools/publish-portable-v2.ps1"
      - "tests/**"
      - "AetherIsland.slnx"
      - "Directory.Build.props"
      - ".github/workflows/windows-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-windows:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Use .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore AetherIsland.slnx
      - name: Build V2 and shared projects
        run: dotnet build AetherIsland.slnx -c Release --no-restore
      - name: Unit tests after all three phases
        run: dotnet test tests/AetherIsland.Tests/AetherIsland.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"
      - name: Create portable self-contained release
        shell: pwsh
        run: ./tools/publish-portable-v2.ps1
      - name: Inspect portable output
        shell: pwsh
        run: |
          $out = 'release/portable-v2/win-x64'
          if (!(Test-Path "$out/AetherIsland.exe")) { throw "Missing portable executable" }
          if (!(Test-Path "$out/portable.flag")) { throw "Missing portable mode marker" }
          if (Test-Path "$out/Data") { throw "User data must not be included in an empty release" }
          $checksum = (Get-FileHash 'release/portable-v2/AetherIsland-Portable-V2-win-x64.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = (Get-Content 'release/portable-v2/AetherIsland-Portable-V2-win-x64.zip.sha256' -Raw).Split(' ')[0]
          if ($checksum -ne $expected) { throw "Portable ZIP hash mismatch" }
      - name: Upload Windows Portable V2
        uses: actions/upload-artifact@v4
        with:
          name: AetherIsland-Portable-V2-win-x64
          path: |
            release/portable-v2/AetherIsland-Portable-V2-win-x64.zip
            release/portable-v2/AetherIsland-Portable-V2-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
